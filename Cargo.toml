[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/noxidsoft/OpenNoxBot"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
omb-wire = { path = "crates/omb-wire" }
omb-core = { path = "crates/omb-core" }
