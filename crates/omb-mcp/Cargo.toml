[package]
name = "omb-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8.9"
omb-core.workspace = true
omb-ssh = { path = "../omb-ssh" }
omb-wire.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["net", "rt", "macros", "sync"] }

[dev-dependencies]
omb-drivers = { path = "../omb-drivers" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["time", "rt", "net"] }
tower = { version = "0.5.3", features = ["util"] }
